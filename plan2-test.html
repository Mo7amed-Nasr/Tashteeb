  o.push('<line x1="'+X(0)+'" y1="'+by+'" x2="'+X(W)+'" y2="'+by+'" stroke="#9C7D42"/><line x1="'+X(0)+'" y1="'+(by-4)+'" x2="'+X(0)+'" y2="'+(by+4)+'" stroke="#9C7D42"/><line x1="'+X(W)+'" y1="'+(by-4)+'" x2="'+X(W)+'" y2="'+(by+4)+'" stroke="#9C7D42"/>'+txt(X(W/2),by+11,W.toFixed(1)+" م",9.5,"#d8c590"));
  var rx=X(W)+16;
  o.push('<line x1="'+rx+'" y1="'+Y(0)+'" x2="'+rx+'" y2="'+Y(D)+'" stroke="#9C7D42"/><line x1="'+(rx-4)+'" y1="'+Y(0)+'" x2="'+(rx+4)+'" y2="'+Y(0)+'" stroke="#9C7D42"/><line x1="'+(rx-4)+'" y1="'+Y(D)+'" x2="'+(rx+4)+'" y2="'+Y(D)+'" stroke="#9C7D42"/><text x="'+(rx+11)+'" y="'+Y(D/2)+'" text-anchor="middle" dominant-baseline="middle" direction="ltr" font-size="9.5" fill="#d8c590" transform="rotate(90 '+(rx+11)+' '+Y(D/2)+')">'+D.toFixed(1)+" م</text>");
  o.push("</svg>");
  return {svg:o.join(""),rooms:R,W:W,D:D,miss:miss+T.bad,why:T.why,doors:doors};
}

var $=function(i){return document.getElementById(i)};
function defOpts(A){return{rooms:A<=80?2:A<=130?3:A<=220?4:5,baths:A<=80?1:A<=130?2:3,kitchen:"open",master:{dress:A>130,bath:A>100,size:A>220?"big":"normal"},recep:A>220?"living":"open"}}
function setOpts(o){$("rooms").value=o.rooms;$("baths").value=o.baths;$("kitchen").value=o.kitchen;$("dress").value=o.master.dress?1:0;$("mbath").value=o.master.bath?1:0;$("msize").value=o.master.size;$("recep").value=o.recep}
function getOpts(){return{rooms:+$("rooms").value,baths:+$("baths").value,kitchen:$("kitchen").value,master:{dress:$("dress").value==="1",bath:$("mbath").value==="1",size:$("msize").value},recep:$("recep").value}}
function run(){var A=+$("a").value;$("av").textContent=A;var o=getOpts(),r;
 try{r=PLAN2(A,o)}catch(x){r={miss:99,why:["خطأ: "+x.message],svg:""}}
 var ok=r.miss===0;$("st").className=ok?"ok":"no";
 $("st").textContent=ok?"✅ الجديد سليم (miss = 0) وهو اللي هيظهر للعميل":"⚠️ الجديد مش مناسب (miss = "+r.miss+") فهيظهر المخطط القديم تلقائياً. السبب: "+(r.why||[]).slice(0,4).join("، ");
 $("nw").innerHTML=r.svg||"";$("od").innerHTML=PLAN(A).svg}
["a","rooms","baths","kitchen","dress","mbath","msize","recep"].forEach(function(i){$(i).addEventListener("input",run)});
$("sg").onclick=function(){setOpts(defOpts(+$("a").value));run()};
setOpts(defOpts(100));run();
</script></body></html>
